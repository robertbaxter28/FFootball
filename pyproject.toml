[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffootball"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
ffootball = "ffootball.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ffootball"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
